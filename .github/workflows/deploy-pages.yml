name: Rebuild and deploy the website

# Rebuilds docs/ (the GitHub Pages export) and commits it back to main
# whenever the app source changes, so the live site never silently falls
# behind — or falls back to demo mode — because a manual export step got
# skipped.
#
# The Supabase URL and publishable (anon) key below are safe to commit:
# they are public by design (they ship verbatim inside the exported JS that
# every visitor downloads) and all data access is guarded server-side by
# row-level security. The secret keys (service_role, database password)
# live only in Supabase and must never appear here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['art-eye/**']

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: art-eye
        run: npm ci

      - name: The venue register is consistent and the SQL matches it
        working-directory: art-eye
        run: npm run check:seed

      - name: Export the web build
        working-directory: art-eye
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://tbdhglobmjnxllvhqsao.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dAPJVhhh9pGp4W2DsWcrLQ_yuh-oqK4
        run: npm run build:pages

      - name: Commit docs/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "docs/ unchanged" || git commit -m "Rebuild docs/ for GitHub Pages [skip ci]"
          git push
