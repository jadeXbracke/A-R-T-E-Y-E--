<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jade Bracke</title>
  <meta name="description" content="Photography portfolio of Jade Bracke.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='black' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body class="has-hero">

  <header class="site-header">
    <a class="wordmark" href="index.html"><span data-config="naam">Jade Bracke</span></a>
    <nav class="site-nav">
      <a href="index.html" class="is-active">Work</a>
      <a href="info.html">Information</a>
    </nav>
  </header>

  <section class="hero">
    <h1 class="hero-title"><span data-config="naam">Jade Bracke</span></h1>
    <div class="hero-meta">
      <span>Photography</span>
      <span class="hero-time"></span>
      <span class="hero-scroll">Have a look</span>
    </div>
  </section>

  <div class="work-toolbar">
    <nav class="series-nav" aria-label="Series"></nav>
    <div class="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="grid" class="is-active">Grid</button>
      <button type="button" data-view="index">Index</button>
    </div>
  </div>

  <main class="grid" aria-label="Photo grid"></main>
  <main class="index" aria-label="Photo index" hidden></main>

  <div class="index-preview" aria-hidden="true"><img src="" alt=""></div>
  <div class="cursor" aria-hidden="true"><span>View</span></div>

  <div class="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" type="button" aria-label="Close">Close</button>
    <div class="lightbox-stage">
      <img src="" alt="">
    </div>
    <button class="lightbox-arrow prev" type="button" aria-label="Previous"></button>
    <button class="lightbox-arrow next" type="button" aria-label="Next"></button>
    <div class="lightbox-bar">
      <span class="lightbox-caption"></span>
      <button class="lightbox-play" type="button">Play</button>
      <span class="lightbox-counter"></span>
    </div>
  </div>

  <footer class="site-footer">
    <a class="footer-cta" data-cta href="mailto:">
      <span class="footer-cta-small">Commissions, collaborations &amp; love letters</span>
      <span class="footer-cta-big">Say hello</span>
    </a>
    <div class="footer-row">
      <span data-config="copyright">© Jade Bracke</span>
      <button class="footer-top" type="button">Up we go</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
